name: Release

on:
  push:
    branches: [main]
    paths:
      - "CHANGELOG.md"
      - "packages/retriever-desktop/src-tauri/tauri.conf.json"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read desktop version
        id: version
        run: |
          VERSION=$(jq -r .version packages/retriever-desktop/src-tauri/tauri.conf.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if this version was already released
        id: check
        run: |
          git fetch --tags origin
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: linux-appimage
            bundle_glob: packages/retriever-desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          - os: windows-latest
            artifact_name: windows-installer
            bundle_glob: packages/retriever-desktop/src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            packages/retriever-web/package-lock.json
            packages/retriever-desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Tauri Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Build API sidecar (Linux)
        if: matrix.os == 'ubuntu-latest'
        working-directory: packages/retriever-api
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt
          ./scripts/build-desktop-api-linux.sh

      - name: Build API sidecar (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: packages/retriever-api
        run: |
          python -m venv .venv
          & ".venv\Scripts\Activate.ps1"
          pip install -r requirements.txt
          & "./scripts/build-desktop-api-windows.ps1"

      - name: Install web dependencies
        working-directory: packages/retriever-web
        run: npm install

      - name: Install desktop dependencies
        working-directory: packages/retriever-desktop
        run: npm install

      - name: Build desktop bundle
        working-directory: packages/retriever-desktop
        run: npm run build

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.bundle_glob }}
          if-no-files-found: error

  publish:
    needs: [check-version, build]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      - name: Extract changelog entry
        run: |
          VERSION_RE=$(printf '%s' "$VERSION" | sed 's/\./\\./g')
          awk -v ver="$VERSION_RE" '
            $0 ~ "^## \\[" ver "\\]" { flag=1; next }
            /^## \[/ { flag=0 }
            flag { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::No CHANGELOG.md entry found for version $VERSION — add one in the same PR that bumps the version." >&2
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE_FLAG=""
          if [[ "$VERSION" =~ -(beta|alpha|rc) ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "v$VERSION" \
            dist-artifacts/linux-appimage/*.AppImage \
            dist-artifacts/windows-installer/*.exe \
            --title "v$VERSION" \
            --notes-file release-notes.md \
            --target "$GITHUB_SHA" \
            $PRERELEASE_FLAG
