name: Release

on:
  push:
    branches: [main]
    paths:
      - "CHANGELOG.md"
      - "packages/retriever-desktop/src-tauri/tauri.conf.json"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read desktop version
        id: version
        run: |
          VERSION=$(jq -r .version packages/retriever-desktop/src-tauri/tauri.conf.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if this version was already released
        id: check
        run: |
          git fetch --tags origin
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            packages/retriever-web/package-lock.json
            packages/retriever-desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Build API sidecar
        working-directory: packages/retriever-api
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt
          ./scripts/build-desktop-api-linux.sh

      - name: Install web dependencies
        working-directory: packages/retriever-web
        run: npm install

      - name: Install desktop dependencies
        working-directory: packages/retriever-desktop
        run: npm install

      - name: Build AppImage
        working-directory: packages/retriever-desktop
        run: npm run build

      - name: Extract changelog entry
        run: |
          VERSION_RE=$(printf '%s' "$VERSION" | sed 's/\./\\./g')
          awk -v ver="$VERSION_RE" '
            $0 ~ "^## \\[" ver "\\]" { flag=1; next }
            /^## \[/ { flag=0 }
            flag { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::No CHANGELOG.md entry found for version $VERSION — add one in the same PR that bumps the version." >&2
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE_FLAG=""
          if [[ "$VERSION" =~ -(beta|alpha|rc) ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "v$VERSION" \
            packages/retriever-desktop/src-tauri/target/release/bundle/appimage/*.AppImage \
            --title "v$VERSION" \
            --notes-file release-notes.md \
            --target "$GITHUB_SHA" \
            $PRERELEASE_FLAG
