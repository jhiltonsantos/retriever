name: Release

on:
  push:
    branches: [main]
    paths:
      - "CHANGELOG.md"
      - "packages/retriever-desktop/src-tauri/tauri.conf.json"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read desktop version
        id: version
        run: |
          VERSION=$(jq -r .version packages/retriever-desktop/src-tauri/tauri.conf.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if this version was already released
        id: check
        run: |
          git fetch --tags origin
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: linux-appimage
            bundle_glob: packages/retriever-desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          - os: windows-latest
            artifact_name: windows-installer
            bundle_glob: packages/retriever-desktop/src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    environment: release-signing
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
      SIGN_WINDOWS: ${{ matrix.os == 'windows-latest' && vars.SIGNPATH_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            packages/retriever-web/package-lock.json
            packages/retriever-desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Tauri Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Build API sidecar (Linux)
        if: matrix.os == 'ubuntu-latest'
        working-directory: packages/retriever-api
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt
          ./scripts/build-desktop-api-linux.sh

      - name: Build API sidecar (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: packages/retriever-api
        run: |
          python -m venv .venv
          & ".venv\Scripts\Activate.ps1"
          pip install -r requirements.txt
          & "./scripts/build-desktop-api-windows.ps1"

      - name: Install web dependencies
        working-directory: packages/retriever-web
        run: npm install

      - name: Install desktop dependencies
        working-directory: packages/retriever-desktop
        run: npm install

      - name: Build desktop bundle
        if: env.SIGN_WINDOWS != 'true'
        working-directory: packages/retriever-desktop
        run: npm run build

      - name: Upload bundle artifact
        if: env.SIGN_WINDOWS != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.bundle_glob }}
          if-no-files-found: error

      # Windows with SignPath (ADR-0009): sign executables, bundle, sign installer.
      - name: Build desktop app without bundling (Windows, signed)
        if: env.SIGN_WINDOWS == 'true'
        working-directory: packages/retriever-desktop
        run: npm run build -- --no-bundle

      - name: Stage executables for signing (Windows)
        if: env.SIGN_WINDOWS == 'true'
        run: |
          $triple = (rustc --print host-tuple).Trim()
          $sidecar = "retriever-api-$triple.exe"
          $tauri = "packages/retriever-desktop/src-tauri"
          foreach ($f in @("$tauri/target/release/retriever.exe", "$tauri/binaries/$sidecar")) {
            if (-not (Test-Path $f)) { throw "Missing executable to sign: $f" }
          }
          New-Item -ItemType Directory -Force -Path unsigned-binaries | Out-Null
          Copy-Item "$tauri/target/release/retriever.exe" unsigned-binaries/
          Copy-Item "$tauri/binaries/$sidecar" unsigned-binaries/
          Add-Content -Path $env:GITHUB_ENV -Value "SIDECAR_FILE=$sidecar"

      - name: Upload unsigned executables
        id: upload-binaries
        if: env.SIGN_WINDOWS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries-unsigned
          path: unsigned-binaries/*
          retention-days: 1
          if-no-files-found: error

      - name: Sign executables (SignPath)
        if: env.SIGN_WINDOWS == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: release-signing
          artifact-configuration-slug: windows-binaries
          github-artifact-id: ${{ steps.upload-binaries.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: "7200"
          output-artifact-directory: signed-binaries

      - name: Replace executables with signed copies (Windows)
        if: env.SIGN_WINDOWS == 'true'
        run: |
          $tauri = "packages/retriever-desktop/src-tauri"
          $exe = Get-ChildItem signed-binaries -Recurse -Filter retriever.exe | Select-Object -First 1
          $side = Get-ChildItem signed-binaries -Recurse -Filter $env:SIDECAR_FILE | Select-Object -First 1
          if (-not $exe -or -not $side) { throw "Signed executables not found in signed-binaries" }
          $targets = @("$tauri/target/release/retriever.exe", "$tauri/binaries/$env:SIDECAR_FILE")
          Copy-Item $exe.FullName $targets[0] -Force
          Copy-Item $side.FullName $targets[1] -Force
          $staged = "$tauri/target/release/retriever-api.exe"
          if (Test-Path $staged) {
            Copy-Item $side.FullName $staged -Force
            $targets += $staged
          }
          foreach ($f in $targets) {
            $sig = Get-AuthenticodeSignature $f
            if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'SignPath') {
              throw "Unexpected signature on ${f}: $($sig.Status)"
            }
          }

      - name: Bundle installer (Windows, signed)
        if: env.SIGN_WINDOWS == 'true'
        working-directory: packages/retriever-desktop
        run: npm run tauri -- bundle

      - name: Upload unsigned installer
        id: upload-installer
        if: env.SIGN_WINDOWS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-unsigned
          path: ${{ matrix.bundle_glob }}
          retention-days: 1
          if-no-files-found: error

      - name: Sign installer (SignPath)
        if: env.SIGN_WINDOWS == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: release-signing
          artifact-configuration-slug: windows-installer
          github-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: "7200"
          output-artifact-directory: signed-installer

      - name: Verify signed installer (Windows)
        if: env.SIGN_WINDOWS == 'true'
        run: |
          $installer = Get-ChildItem signed-installer -Recurse -Filter *.exe
          if (-not $installer) { throw "Signed installer not found in signed-installer" }
          foreach ($f in $installer) {
            $sig = Get-AuthenticodeSignature $f.FullName
            if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'SignPath') {
              throw "Unexpected signature on $($f.Name): $($sig.Status)"
            }
          }

      - name: Upload signed installer
        if: env.SIGN_WINDOWS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: signed-installer/**/*.exe
          if-no-files-found: error

  publish:
    needs: [check-version, build]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      - name: Extract changelog entry
        run: |
          VERSION_RE=$(printf '%s' "$VERSION" | sed 's/\./\\./g')
          awk -v ver="$VERSION_RE" '
            $0 ~ "^## \\[" ver "\\]" { flag=1; next }
            /^## \[/ { flag=0 }
            flag { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::No CHANGELOG.md entry found for version $VERSION — add one in the same PR that bumps the version." >&2
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE_FLAG=""
          if [[ "$VERSION" =~ -(beta|alpha|rc) ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "v$VERSION" \
            dist-artifacts/linux-appimage/*.AppImage \
            dist-artifacts/windows-installer/*.exe \
            --title "v$VERSION" \
            --notes-file release-notes.md \
            --target "$GITHUB_SHA" \
            $PRERELEASE_FLAG
